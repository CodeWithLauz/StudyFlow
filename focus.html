<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
    
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: white;
    color: #222222;
    padding: 35px 20px;
    min-height: 100vh;
}

button,
select {
    font: inherit;
}

button {
    cursor: pointer;
    transition: background 0.2s ease, 
                transform 0.2s ease;
}

button:focus-visible,
select:focus-visible {
    outline: 2px solid #555555;
    outline-offset: 3px;
}

.focus-screen {
    display: block;
    max-width: 850px;
    margin: 0 auto;
}

.focus-screen header {
    padding-bottom: 22px;
    border-bottom: 1px solid #e3e3df;
    margin-bottom: 35px;
}

.focus-screen header h1 {
    font-size: 21px;
    letter-spacing: 2px;
    font-weight: 700;
}

.back-to-dashboard {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: #555555;
    border: 1px solid #deded9;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 45px;
}

.back-to-dashboard:hover {
    background: #eaeae5;
}

.focus-content {
    max-width: 520px;
    margin: 0 auto;
    text-align: center;
}

.focus-content h2 {
    font-size: clamp(32px, 5vw, 38px);
    font-weight: 600;
    letter-spacing: -1px;
    margin-bottom: 12px;
}

.focus-description {
    color: ;
    font-size: 10px;
    line-height: 1.7;
    margin-bottom: 40px;
}


.focus-description span{
    color:#777770 ;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 40px;
    
}

.focus-timer-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
    text-align: left;
}

.focus-timer-section label {
    font-size: 13px;
    font-weight: 600;
    color: #444444;
}

.focus-timer-section select {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    border: 1px solid #deded9;
    border-radius: 9px;
    background: #ffffff;
    color: #292929;
    font-size: 14px;
    outline: none;
}


.focus-timer-section select:focus {
    border-color: #888880;
}


.focus-timer-section {
    background: #ffffffff;
    border: 1px solid #e9e9e4;
    border-radius: 18px;
    padding: 28px;
    margin-top: 32px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.035);
}

.focus-timer {
    text-align: center;
    font-size: clamp(55px, 12vw, 76px);
    font-weight: 600;
    letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
    color: #222222;
    padding: 25px 0;
}

.focus-controls {
    display: flex;
    gap: 12px;
    margin-top: 10px;
}

.focus-controls button {
    flex: 1;
    min-height: 48px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid #deded9;
    background: #f5f5f1;
    color: #292929;
}

.focus-controls button:hover {
    background: #eaeae5;
}

.focus-controls button:active,
.back-to-dashboard:active {
    transform: scale(0.98);
}

.start-focus {
    background: #4812189d !important;
    color: #ffffff !important;
    border-color: transparent !important;    
}

.start-focus:hover {
    background: #3b3b3b !important;
}

.end-study{
            border: none;
            background: #000000af;
            color: white;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
}

.session-overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.45); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            z-index: 1000; 
} 
.session-popup { 
           background: #ffffff; 
           width: 100%; 
           max-width: 380px; 
           padding: 30px 24px; 
           border-radius: 16px; 
           text-align: center; 
           box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15); 
} 

.session-popup h2 { 
           font-size: 24px; 
           margin-bottom: 15px; 
} 

.recorded-task { 
           font-size: 17px; 
           font-weight: 600; 
           margin-bottom: 25px; 
           overflow-wrap: anywhere; 
} 

.session-details { 
           background: #f5f5f1; 
           border-radius: 10px; 
           padding: 20px; 
           margin-bottom: 25px; 
} 

.session-details p { 
           color: #777777; 
           font-size: 13px; 
           margin-bottom: 8px; 
} 

.recorded-time { 
           font-size: 25px; 
} 

.return-dashboard { 
           width: 100%; 
           background: #481218; 
           color: #ffffff; 
           border: none; 
           padding: 13px; 
           border-radius: 8px; 
           font-size: 14px; 
           font-weight: 600; 
} 

.return-timer {
    width: 100%;
    background: grey;
    color: black;
    border: 1px solid transparent;
    padding: 13px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
}

.return-timer:hover {
    background: #f5eeee;
}


@media (max-width: 600px) {
    body {
        padding: 24px 17px;
    }

    .focus-screen header {
        margin-bottom: 28px;
    }

    .back-to-dashboard {
        margin-bottom: 35px;
    }

    .focus-description {
        font-size: 14px;
        margin-bottom: 30px;
    }

    .focus-timer-section {
        padding: 22px 17px;
        border-radius: 14px;
    }

    .focus-timer {
        padding: 22px 0;
        letter-spacing: -2px;
    }

    .focus-controls {
        gap: 8px;
    }

    .focus-controls button {
        min-height: 46px;
        font-size: 13px;
    }
}


</style>
<body>
    <main class="focus-screen">

    <header>
        <h1>STUDYFLOW</h1>
    </header>

    <button class="back-to-dashboard">
        ← Back to Dashboard
    </button>

    <section class="focus-content">

        <h2>Focus Mode</h2>

        <p class="focus-description">
            Give it your attention. <br><br> <span>Start Studying</span>
        </p>


        <div class="focus-timer-section">

            <label for="focus-duration">Study duration</label>

            <select id="focus-duration">
                <option value="900">15 minutes</option>
                <option value="1500" >25 minutes</option>
                <option value="1800">30 minutes</option>
                <option value="3600">1 hour</option>
            </select>

            <div class="focus-timer">25:00</div>

            <div class="focus-controls">

                <button class="start-focus">Start</button>

                <button class="pause-focus">Pause</button>

                <button class="reset-focus">Reset</button>

            </div>
<button class="end-study">End Study</button>
        </div>
        
        <!-- Session recording popup --> 
        <div class="session-overlay" style="display: none;"> 
            
       <div class="session-popup"> 
           
           <h2 class="session-title">Session Complete!</h2> 
           <p class="recorded-task"></p> 
           
           <div class="session-details"> 
           <p class="session-message">Study time</p> 
      <h3 class="recorded-time">0 minutes</h3> 
      
      </div> 

<button class="return-dashboard"> Return to Dashboard </button> 

        <button class="return-timer" 
style="display: none;">
            Return to Timer
        </button>
        
     </div> 
     </div> 

                    
    </section>
</main>

<script>
    const backToDashboard = document.querySelector(".back-to-dashboard");
    
    const focusTimer = document.querySelector(".focus-timer");
    
    const startFocus = document.querySelector(".start-focus");
    
    const focusDuration = document.querySelector("#focus-duration");
    
    const urlParameters = new URLSearchParams(window.location.search);

const selectedTask = urlParameters.get("task");
    
    const taskId = Number(urlParameters.get("id"));
    
    const pauseFocus = document.querySelector(".pause-focus");
    
    const resetFocus = document.querySelector(".reset-focus");
    
    const endStudy = document.querySelector(".end-study");

    const sessionOverlay = document.querySelector(".session-overlay");

    const recordedTask = document.querySelector(".recorded-task");

    const recordedTime = document.querySelector(".recorded-time");

    const returnDashboard = document.querySelector(".return-dashboard");
    
    const sessionTitle = document.querySelector(".session-title");

    const sessionMessage = document.querySelector(".session-message");

    const returnTimer = document.querySelector(".return-timer");
    
<!-- Linking dashboard to focus -->
backToDashboard.addEventListener("click", function() {
    window.location.href = "index.html";
});


let remainingTime = Number(focusDuration.value);
<!-- remaining time tracks where you are now-->

let startingTime = remainingTime;
<!-- Starting time remembers where you started -->

let timerInterval = null;
<!-- we haven't given timeInterval a value yet,but we use setInterval to do that -->

let hasStarted = false;
let elapsedTime = 0;

<!-- Timer calculation and format aa : bb-->
function updateTimerDisplay() {
    const minutes = Math.floor(remainingTime / 60);
    const seconds = remainingTime % 60;

    focusTimer.textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
}

updateTimerDisplay();

<!-- adding life to start btn -->
startFocus.addEventListener("click", function() {
    if (timerInterval !== null) {
        return;
    }

    if (!hasStarted) {
        startingTime = Number(focusDuration.value);
        remainingTime = startingTime;
        hasStarted = true;
        updateTimerDisplay();
    }

      <!--calculating how time move-->
    timerInterval = setInterval(function() {
        if (remainingTime > 0) {
            remainingTime--;
            elapsedTime++;
            updateTimerDisplay();
        } else {
            clearInterval(timerInterval);
            timerInterval = null;
            hasStarted = false;
        }
    }, 1000);
});

<!-- pause -->
pauseFocus.addEventListener("click", function() {
    clearInterval(timerInterval);
    timerInterval = null;
});

<!-- reset -->
resetFocus.addEventListener("click", function() {
    clearInterval(timerInterval);
    timerInterval = null;

    remainingTime = startingTime;
    elapsedTime = 0;
    hasStarted = false;

    updateTimerDisplay();
});

    focusDuration.addEventListener("change", function() {
    if (!hasStarted && timerInterval === null) {
        remainingTime = Number(focusDuration.value);
        startingTime = remainingTime;
        updateTimerDisplay();
    }
});

<!-- End study and display session tu -->

        endStudy.addEventListener("click", function() {

    <!-- Stop the timer -->
    clearInterval(timerInterval);
    timerInterval = null;
    hasStarted = false;

<!-- Check whether any study time was recorded-->
    if (elapsedTime === 0) {

        <!-- Display the warning -->
        sessionTitle.textContent = "No Study Time Recorded";

        recordedTask.textContent =
            "You haven't studied yet.";

        sessionMessage.textContent =
            "Start your timer when you're ready to study.";

        recordedTime.textContent = "0 seconds";

        <!-- Hide the dashboard button -->
        returnDashboard.style.display = "none";

        <!-- Show the timer button -->
        returnTimer.style.display = "block";

    } else {

       <!-- Display the session recording -->
        sessionTitle.textContent = "Session Complete!";

         const tasks = JSON.parse(
    localStorage.getItem("studyFlowTasks")
) || [];

const task = tasks.find(function(item) {
    return item.id === taskId;
});

if (task) {
    task.completed = true;

    localStorage.setItem(
        "studyFlowTasks",
        JSON.stringify(tasks)
    );
}

        recordedTask.textContent =
            selectedTask || "Study Session";

        sessionMessage.textContent = "Study time";

        const minutes = Math.floor(elapsedTime / 60);
        const seconds = elapsedTime % 60;

        if (minutes === 0) {

            recordedTime.textContent =
                seconds + (seconds === 1 ? " second" : " seconds");

        } else if (seconds === 0) {

            recordedTime.textContent =
                minutes + (minutes === 1 ? " minute" : " minutes");

        } else {

            recordedTime.textContent =
                minutes + " min " + seconds + " sec";

        }

         <!-- Show the dashboard button -->
        returnDashboard.style.display = "block";

         <!-- Hide the timer button -->
        returnTimer.style.display = "none";

    }

       <!-- Display the popup -->
    sessionOverlay.style.display = "flex";

});

     <!-- Return to dashboard -->

returnDashboard.addEventListener("click", function() {

    window.location.href = "index.html";

});

returnTimer.addEventListener("click", function() {
    sessionOverlay.style.display = "none";
});

</script>
</body>
</html>
